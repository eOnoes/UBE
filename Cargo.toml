[workspace]
members = ["crates/*", "examples/sandbox", "examples/gallery", "games/ornith"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.37.0"
egui-wgpu = { version = "0.37.0", default-features = false }
glam = "0.34"
gltf = "1.4.1"
pollster = "1.0"
rapier3d = "0.36.1"
raw-window-handle = "0.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = "0.30"
